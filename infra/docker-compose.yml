# AI 英语口语陪练 MVP — 本地依赖服务
# 仅启动 MySQL、RabbitMQ、MinIO；API / Worker / Web 仍在宿主机运行。
# 用法见 docs/联调记录/E-02-本地依赖环境启动说明.md

services:
  mysql:
    image: mysql:8.0
    container_name: ai-coach-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: conversation_coach
      MYSQL_USER: coach
      MYSQL_PASSWORD: coach_dev
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ai-coach-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: coach
      RABBITMQ_DEFAULT_PASS: coach_dev
      TZ: UTC
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ai-coach-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: UTC
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    container_name: ai-coach-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/conversation-coach-media --ignore-existing &&
      mc anonymous set none local/conversation-coach-media &&
      echo 'MinIO bucket conversation-coach-media is ready.'
      "
    restart: "no"

volumes:
  mysql_data:
  rabbitmq_data:
  minio_data:
