[project]
name = "qiniu-ai-conversation-coach-api"
version = "0.1.0"
description = "FastAPI backend for AI English conversation coach MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.119.0",
  "uvicorn>=0.38.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.0.0",
  "PyJWT>=2.0.0",
  "python-multipart>=0.0.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
